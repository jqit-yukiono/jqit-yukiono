name: Update Qiita articles

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update README
        env:
          QIITA_USER: jqit-yukiono
          # Optional. Without it the public API is used (60 req/h per IP, no view counts).
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: python3 scripts/update_qiita.py

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: Qiitaの記事一覧を更新"
          git push
